name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck must run alongside the tests, not instead of them. The
      # @ts-expect-error assertions in src/lib/questions/__tests__/types.test.ts
      # are invisible to Jest — they only fail here. Dropping this step would
      # silently stop checking half that file.
      #
      # `verify` runs typecheck, lint, and the unit suite.
      - run: npm run verify

  # Integration tests need a real Postgres, so they run separately against a
  # Supabase stack rather than being folded into `verify`.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. The CLI decides what `supabase status -o env`
          # emits, so `latest` lets an upstream release change this job's inputs
          # on a push that touched nothing near it. This is the version
          # developers run locally; moving it should be a commit someone made on
          # purpose.
          version: 2.71.3

      - run: npm ci

      - name: Start Supabase
        run: supabase start

      # Deliberately not gating on `supabase db reset`'s exit code — it is
      # flaky (a 502 at the container-restart step) even when every migration
      # applied fine. `supabase start` already runs the migrations; the step
      # below asserts on database state instead, which is the real check.
      # Queried with psql against the URL the CLI reports, because
      # `supabase db execute` does not exist — the CLI has diff, dump, lint,
      # pull, push, reset and start, and nothing that runs a statement. The
      # original step also sent stderr to /dev/null, so the unknown command
      # said nothing and the step failed with an empty count and no reason.
      # Errors are left visible here for that reason.
      - name: Assert reference data landed
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          COUNT=$(psql "$DB_URL" -tAc "select count(*) from subteams;")
          echo "subteams=$COUNT"
          test "$COUNT" = "12"

      # Every value is checked before it is written. An empty key here does not
      # fail this step — it fails every integration test at once with
      # "permission denied for table teams", which reads like a database or RLS
      # problem and is nothing of the kind. One clear error beats sixty
      # misleading ones.
      - name: Write test env
        run: |
          STATUS=$(supabase status -o env)
          read_value() { printf '%s\n' "$STATUS" | grep "^$1=" | cut -d= -f2- | tr -d '"'; }

          API_URL=$(read_value API_URL)
          # Newer CLI releases renamed these to PUBLISHABLE_KEY and SECRET_KEY.
          # Both spellings are accepted so a pin bump does not silently empty them.
          ANON=$(read_value ANON_KEY)
          [ -n "$ANON" ] || ANON=$(read_value PUBLISHABLE_KEY)
          SERVICE=$(read_value SERVICE_ROLE_KEY)
          [ -n "$SERVICE" ] || SERVICE=$(read_value SECRET_KEY)

          for pair in "API_URL=$API_URL" "ANON_KEY=$ANON" "SERVICE_ROLE_KEY=$SERVICE"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::${pair%%=*} came back empty from 'supabase status -o env'"
              printf '%s\n' "$STATUS" | cut -d= -f1
              exit 1
            fi
          done

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
          } >> .env.local

      - run: npm run test:integration
